# Servidor do front-end em produção: arquivos estáticos + proxy da API na MESMA origem
# (por isso a API não precisa de CORS).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- cabeçalhos de segurança -------------------------------------------------------------
    # CSP restritiva: só scripts/estilos/conexões da própria origem. Reduz o estrago de um XSS —
    # relevante porque o refresh token fica em localStorage (ver frontend/src/auth/tokenStore.ts).
    # style-src-attr 'unsafe-inline' existe só para os atributos style="" que o React gera nos gráficos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # --- API: encaminha para o serviço "api" da rede do Docker Compose ---------------------------
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- arquivos com hash no nome: cache "para sempre" -------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header em um location descarta os do nível acima: repete os de segurança.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- SPA: qualquer outra rota devolve o index.html (sem cache, para pegar deploys novos) -------
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
