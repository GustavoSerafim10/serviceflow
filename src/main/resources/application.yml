spring:
  application:
    name: serviceflow

  datasource:
    url: jdbc:postgresql://localhost:5432/serviceflow
    username: serviceflow
    password: serviceflow

  jpa:
    # 'validate': o Hibernate NUNCA cria/altera tabelas sozinho, apenas confere
    # se as entidades batem com o schema que o Flyway já criou. Quem manda no
    # schema é sempre a migration, nunca o Hibernate — isso evita "mágica"
    # escondida e é o padrão profissional (ddl-auto: update é ok só em protótipo).
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Configurações próprias do ServiceFlow. A sintaxe ${VAR:padrão} lê a variável
# de ambiente VAR e, se ela não existir, usa o valor padrão (bom para dev).
# EM PRODUÇÃO: defina JWT_SECRET, ADMIN_EMAIL e ADMIN_PASSWORD no ambiente;
# os padrões abaixo são públicos (estão no GitHub) e NÃO são seguros.
app:
  jwt:
    # Chave HMAC em Base64 (mínimo 256 bits). Quem tem esta chave forja tokens.
    secret: ${JWT_SECRET:c2VydmljZWZsb3ctZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
    expiration-minutes: 60
  # Primeiro ADMIN, criado na subida SÓ se a tabela de usuários estiver vazia.
  bootstrap-admin:
    name: Administrador
    email: ${ADMIN_EMAIL:admin@serviceflow.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
